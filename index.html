<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Share from your phone — prototype</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #1c1f26; background: #f6f7fb; }
  .panel { background: #fff; border-radius: 20px; padding: 32px; width: 420px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #6b7280; margin: 0 0 20px; }
  #qr { display: inline-block; padding: 12px; background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; }
  #qr img, #qr svg { display: block; width: 280px; height: 280px; }
  a { color: #3b5bdb; word-break: break-all; font-size: 14px; }
  label { display: block; margin-top: 16px; font-size: 14px; color: #6b7280; }
</style>
</head>
<body>
  <main class="panel">
    <h1>Share your fundraiser from your phone</h1>
    <p>Scan the code with your phone camera. The page opens with the coach text and a Share button.</p>
    <div id="qr"></div>
    <p style="margin-top:16px"><a id="target" target="_blank" rel="noopener"></a></p>
    <label><input type="checkbox" id="auto"> Try share on load without a tap (<code>?auto=1</code>)</label>
  </main>
  <script src="qrcode.js"></script>
  <script>
    const render = () => {
      const target = new URL('share.html', location.href);
      if (document.getElementById('auto').checked) target.searchParams.set('auto', '1');
      const qr = qrcode(0, 'M');
      qr.addData(target.href);
      qr.make();
      document.getElementById('qr').innerHTML = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true });
      const link = document.getElementById('target');
      link.textContent = target.href;
      link.href = target.href;
    };
    document.getElementById('auto').addEventListener('change', render);
    render();
  </script>
</body>
</html>
